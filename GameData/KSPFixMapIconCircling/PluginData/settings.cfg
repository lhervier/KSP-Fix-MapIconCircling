// Read once when KSP starts: quit KSP, edit this file, start KSP again.

// Keeps the centre of mass of an unloaded landed vessel, hence its icon in the map view, at its place after a floating
// origin shift longer than 10 km. Such shifts happen at every physics step in high time warp, while the active vessel
// flies or orbits: without this fix, the icon of a vessel landed elsewhere circles around its real place.
fixLandedCoMAfterShift = True

// How much the mod writes to KSP.log: Error, Warning, Info or Debug. At Debug, one line every 1000 corrections.
logLevel = Info
